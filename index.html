<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mapa da Conversa — Uma primeira leitura</title>

<style>
:root {
  --navy: #01319D;
  --green: #86BD08;
  --purple: #834DAF;
  --offwhite: #F6F4F7;
  --charcoal: #3E4649;
  --white: #FFFFFF;
}

* {
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--offwhite);
  color: var(--charcoal);
  margin: 0;
  padding: 40px 16px;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}

.card {
  background: var(--white);
  border-radius: 20px;
  max-width: 680px;
  width: 100%;
  padding: 44px 36px;
  box-shadow: 0 10px 40px rgba(1, 49, 157, 0.12);
}

.brand {
  color: var(--navy);
  font-weight: 800;
  letter-spacing: .08em;
  font-size: 13px;
  margin-bottom: 8px;
}

h1, h2 {
  font-family: Georgia, serif;
  color: var(--navy);
}

.intro-title {
  font-size: 30px;
  line-height: 1.2;
  margin: 8px 0 14px;
}

.intro-text {
  font-size: 16px;
  line-height: 1.65;
  margin-bottom: 24px;
}

.how-to-answer {
  background: #f6f8fc;
  border-left: 4px solid var(--green);
  border-radius: 10px;
  padding: 16px 18px;
  margin-bottom: 24px;
  font-size: 15px;
  line-height: 1.55;
}

.progress-wrap {
  background: var(--offwhite);
  border-radius: 10px;
  height: 8px;
  margin: 18px 0 30px;
  overflow: hidden;
}

.progress-bar {
  background: var(--green);
  height: 100%;
  width: 0%;
  transition: width .3s ease;
}

.qtext {
  font-size: 22px;
  line-height: 1.45;
  margin-bottom: 26px;
}

.opt {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--offwhite);
  border: 2px solid transparent;
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 12px;
  font-size: 15.5px;
  line-height: 1.5;
  color: var(--charcoal);
  cursor: pointer;
  transition: all .15s ease;
}

.opt:hover {
  border-color: var(--green);
  background: #f0f7e0;
}

.btn {
  display: inline-block;
  background: var(--green);
  color: white;
  font-weight: 700;
  border: none;
  border-radius: 30px;
  padding: 15px 32px;
  font-size: 15.5px;
  cursor: pointer;
  width: 100%;
  margin-top: 16px;
}

.result-kicker {
  color: var(--green);
  font-weight: 800;
  letter-spacing: .06em;
  font-size: 13px;
  margin-bottom: 8px;
}

.result-title {
  font-size: 30px;
  line-height: 1.2;
  margin: 0 0 18px;
}

.result-meta {
  background: var(--offwhite);
  border-radius: 14px;
  padding: 18px 20px;
  margin-bottom: 24px;
}

.meta-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: #687276;
  font-weight: 800;
}

.meta-value {
  color: var(--navy);
  font-size: 18px;
  font-weight: 800;
  margin-top: 3px;
}

.result-quote {
  font-style: italic;
  font-size: 18px;
  line-height: 1.5;
  color: var(--purple);
  border-left: 4px solid var(--green);
  padding-left: 16px;
  margin-bottom: 22px;
}

.result-text {
  font-size: 15.5px;
  line-height: 1.7;
  margin-bottom: 16px;
}

.result-label {
  font-weight: 800;
  color: var(--navy);
  margin: 22px 0 7px;
}


.capture-title {
  font-size: 26px;
  line-height: 1.3;
  margin: 0 0 14px;
}

.capture-text {
  font-size: 15.5px;
  line-height: 1.65;
  margin-bottom: 22px;
}

.field {
  margin-bottom: 16px;
}

.field label {
  display: block;
  font-size: 13px;
  font-weight: 800;
  color: var(--navy);
  margin-bottom: 7px;
}

.field input {
  width: 100%;
  border: 1px solid #d7dce2;
  border-radius: 10px;
  padding: 13px 14px;
  font-size: 16px;
  color: var(--charcoal);
  outline: none;
}

.field input:focus {
  border-color: var(--green);
}

.form-error {
  color: #a33a3a;
  font-size: 14px;
  line-height: 1.5;
  margin: 10px 0;
}

.result-secondary {
  margin-top: 10px;
  font-size: 15.5px;
  line-height: 1.6;
}


@media (max-width: 520px) {
  body {
    padding: 18px 10px;
  }

  .card {
    padding: 30px 20px;
    border-radius: 16px;
  }

  .intro-title,
  .result-title {
    font-size: 26px;
  }

  .qtext {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="brand">MAPA DA CONVERSA</div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div id="quizArea"></div>

</div>

<script>

const QUESTIONS = [

      ["Procurar a amiga imediatamente para tentar resolver o afastamento, sem antes entender o que está acontecendo.", "ATROPELO"],

  {

    options: [

const RESULTS = {

    movimento: "Pergunte a si mesma: o que eu gostaria de dizer se não precisasse controlar a reação do outro?"
  },

  ATROPELO: {
    nome: "ATROPELO",
    conversa: "Eu preciso avançar.",
    texto: "O Atropelo aparece quando a necessidade de avançar, resolver ou conduzir faz você ocupar o espaço da conversa antes que o outro termine de construir o que queria dizer. Esse movimento traz iniciativa, ação e capacidade de condução. O ponto de atenção aparece quando essa velocidade faz você perder informações importantes.",
    movimento: "Antes de avançar, pergunte: o que ainda precisa ser ouvido antes de eu responder?"
  },

  APROVAÇÃO: {
    nome: "APROVAÇÃO",
    conversa: "Eu me adapto a você.",
    texto: "A Aprovação aparece quando a necessidade de preservar o vínculo faz você adaptar sua posição ao que acredita que o outro espera. Esse movimento traz empatia, sensibilidade e cuidado com os relacionamentos. O ponto de atenção aparece quando, para evitar desagradar, você deixa sua própria posição em segundo plano.",
    movimento: "Pergunte: o que é verdadeiro para mim nesta situação, antes de pensar no que o outro gostaria de ouvir?"
  },

  EXPLICAÇÃO: {
    nome: "EXPLICAÇÃO",
    conversa: "Eu preciso explicar.",
    texto: "A Explicação aparece quando existe uma necessidade de garantir que o outro compreenda aquilo que você quer dizer. Esse movimento traz capacidade de aprofundar, esclarecer e organizar informações. O ponto de atenção aparece quando você continua explicando além do necessário e deixa menos espaço para o outro.",
    movimento: "Pergunte: o que é essencial dizer agora?"
  },

  COMPETIÇÃO: {
    nome: "COMPETIÇÃO",
    conversa: "Eu não posso ficar por baixo.",
    texto: "A Competição aparece quando a pessoa entra na conversa medindo seu valor em relação ao outro. Esse movimento traz ambição, determinação e desejo de crescer. O ponto de atenção aparece quando a necessidade de sustentar sua posição transforma a conversa em uma disputa para provar quem tem razão.",
    movimento: "Experimente trocar, por alguns instantes, a necessidade de responder pela curiosidade: o que existe no ponto de vista do outro que eu ainda não considerei?"
  },

  DESCONEXÃO: {
    nome: "DESCONEXÃO",
    conversa: "Eu já sei onde essa conversa vai dar.",
    texto: "A Desconexão acontece quando você deixa de acompanhar o que o outro está realmente dizendo porque sua própria narrativa interna passa a ocupar o lugar da escuta. Esse movimento pode trazer autonomia e capacidade de preservar energia. O ponto de atenção aparece quando você começa a reagir a uma interpretação sua, em vez de acompanhar o que está sendo construído na conversa.",
    movimento: "Pergunte: estou acompanhando o que o outro realmente disse ou já estou reagindo à história que criei na minha cabeça?"
  }

};


let currentQuestion = 0;
let answers = [];
let leadName = "";
let leadEmail = "";
let currentResult = null;

const quizArea = document.getElementById("quizArea");
const progressBar = document.getElementById("progressBar");


function renderIntro() {

  progressBar.style.width = "0%";

  quizArea.innerHTML = `
    <h1 class="intro-title">
      Descubra o que pode estar por trás da maneira como você se comunica.
    </h1>

    <p class="intro-text">
      Responda a 9 situações do dia a dia.
      No final, você terá uma primeira leitura das tendências
      que podem aparecer nas suas conversas.
    </p>

    <div class="how-to-answer">
      <strong>Como responder</strong>

      <p>
        Em cada pergunta, escolha a alternativa que mais se aproxima
        do que costuma acontecer com você.
      </p>

      <p>
        Não precisa ser exatamente assim em todas as situações.
        Pense na sua tendência mais frequente.
      </p>
    </div>

    <button class="btn" onclick="startQuiz()">
      Começar o quiz →
    </button>
  `;
}


function startQuiz() {

  currentQuestion = 0;
  answers = [];

  renderQuestion();
}


function renderQuestion() {

  const progress =
    Math.round((currentQuestion / QUESTIONS.length) * 100);

  progressBar.style.width = progress + "%";

  const question = QUESTIONS[currentQuestion];

  let html = `
    <h2 class="qtext">
      ${question.situacao}
    </h2>
  `;

  question.options.forEach((option, index) => {

    html += `
      <button
        class="opt"
        onclick="selectAnswer(${index})">
        ${String.fromCharCode(65 + index)}. ${option[0]}
      </button>
    `;

  });

  quizArea.innerHTML = html;
}


function selectAnswer(optionIndex) {

  const question = QUESTIONS[currentQuestion];

  answers.push(question.options[optionIndex][1]);

  currentQuestion++;

  if (currentQuestion < QUESTIONS.length) {

    renderQuestion();

  } else {

    showCapture();

  }
}


function calculateScores() {

  const scores = {
    DEFESA: 0,
    RESGUARDO: 0,
    ATROPELO: 0,
    APROVAÇÃO: 0,
    EXPLICAÇÃO: 0,
    COMPETIÇÃO: 0,
    DESCONEXÃO: 0
  };

  answers.forEach(pattern => {

    if (scores[pattern] !== undefined) {
      scores[pattern]++;
    }

  });

  return scores;
}


function getResultData() {
  const scores = calculateScores();

  const ordered = Object.keys(scores)
    .sort((a, b) => scores[b] - scores[a]);

  const highest = scores[ordered[0]];

  const primaryPatterns = ordered.filter(
    pattern => scores[pattern] === highest
  );

  // Empate no topo: não força predominante.
  if (primaryPatterns.length > 1) {
    return {
      scores,
      primary: null,
      primaryPatterns,
      secondary: null,
      primaryScore: highest,
      secondaryScore: null
    };
  }

  const primary = primaryPatterns[0];
  const primaryScore = scores[primary];

  const candidates = ordered
    .filter(pattern => pattern !== primary)
    .filter(pattern => scores[pattern] >= 2)
    .filter(pattern => scores[pattern] / primaryScore >= 0.60);

  const secondary = candidates.length ? candidates[0] : null;
  const secondaryScore = secondary ? scores[secondary] : null;

  return {
    scores,
    primary,
    primaryPatterns,
    secondary,
    primaryScore,
    secondaryScore
  };
}


function showCapture() {

  progressBar.style.width = "100%";

  quizArea.innerHTML = `
    <div class="result-kicker">
      SEU RESULTADO ESTÁ PRONTO
    </div>

    <h1 class="capture-title">
      Antes de ver sua primeira leitura, deixe seu e-mail.
    </h1>

    <p class="capture-text">
      Vamos enviar seu resultado por e-mail para você poder consultar depois.
    </p>

    <div class="field">
      <label for="leadName">Seu nome</label>
      <input
        id="leadName"
        type="text"
        autocomplete="name"
        placeholder="Como você gostaria de ser chamada?"
      >
    </div>

    <div class="field">
      <label for="leadEmail">Seu melhor e-mail</label>
      <input
        id="leadEmail"
        type="email"
        autocomplete="email"
        placeholder="seuemail@exemplo.com"
      >
    </div>

    <div id="formError"></div>

    <button class="btn" onclick="submitLead()">
      Ver meu resultado →
    </button>
  `;
}


async function submitLead() {

  const nameInput = document.getElementById("leadName");
  const emailInput = document.getElementById("leadEmail");
  const errorArea = document.getElementById("formError");
  const button = document.querySelector(".btn");

  leadName = nameInput.value.trim();
  leadEmail = emailInput.value.trim();

  if (!leadName) {
    errorArea.innerHTML =
      '<div class="form-error">Digite seu nome para continuar.</div>';
    nameInput.focus();
    return;
  }

  if (!leadEmail || !emailInput.checkValidity()) {
    errorArea.innerHTML =
      '<div class="form-error">Digite um e-mail válido para continuar.</div>';
    emailInput.focus();
    return;
  }

  currentResult = getResultData();

  button.disabled = true;
  button.textContent = "Preparando seu resultado...";

  errorArea.innerHTML = "";

  try {

    const response = await fetch(
      "https://gykonsallbevyoaeiiqt.supabase.co/functions/v1/send-quiz-result",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          name: leadName,
          email: leadEmail,
          result: currentResult.primary || "EMPATE",
          secondary: currentResult.secondary,
          primaryPatterns: currentResult.primaryPatterns,
          pontuacaoPredominante: currentResult.primaryScore,
          pontuacaoSecundario: currentResult.secondaryScore,
          respostas: answers
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(
        data.error || "Não foi possível enviar seu resultado."
      );
    }

    showResult(currentResult);

  } catch (error) {

    console.error(error);

    button.disabled = false;
    button.textContent = "Tentar novamente";

    errorArea.innerHTML = `
      <div class="form-error">
        Não conseguimos enviar seu resultado agora.
        Confira seu e-mail ou tente novamente em alguns instantes.
      </div>
    `;
  }
}


function showResult(resultData) {

  const {
    primary,
    primaryPatterns,
    secondary
  } = resultData;

  // Empate no topo: não escolhemos um predominante artificialmente.
  if (!primary) {

    quizArea.innerHTML = `

      <div class="result-kicker">
        UMA PRIMEIRA LEITURA DO SEU MAPA
      </div>

      <h1 class="result-title">
        Seu resultado
      </h1>

      <div class="result-meta">

        <div class="meta-label">
          As tendências que mais apareceram
        </div>

        <div class="meta-value">
          ${primaryPatterns.join(" + ")}
        </div>

      </div>

      <div class="result-text">
        Suas respostas ficaram equilibradas entre essas tendências.
        Por isso, não vamos escolher uma delas artificialmente como predominante.
      </div>

      <div class="result-label">
        O que isso significa?
      </div>

      <div class="result-text">
        O Quiz oferece uma primeira leitura. O Mapa da Conversa aprofunda
        a análise para entender como esses movimentos podem aparecer
        juntos nas suas conversas.
      </div>

      <div class="result-label">
        Seu resultado também foi enviado por e-mail.
      </div>

      <div class="result-text">
        Confira sua caixa de entrada para continuar a leitura.
      </div>

      <div class="result-label">
        Quer aprofundar essa leitura?
      </div>

      <div class="result-text">
        O Mapa da Conversa completo analisa suas respostas
        em 18 situações para mostrar como suas travas aparecem
        ao Escutar, Falar e Interagir.
      </div>

      <button class="btn"
        onclick="window.location.href='https://www.adrianadecastro.com.br/mapa-da-conversa'">
        Quero conhecer meu Mapa da Conversa completo →
      </button>

    `;

    return;
  }

  const result = RESULTS[primary];

  const secondaryBlock = secondary
    ? `
      <div class="result-label">
        Uma segunda tendência também apareceu
      </div>

      <div class="result-secondary">
        <strong>${secondary}</strong>
      </div>
    `
    : "";

  quizArea.innerHTML = `

    <div class="result-kicker">
      UMA PRIMEIRA LEITURA DO SEU MAPA
    </div>

    <h1 class="result-title">
      Seu resultado
    </h1>

    <div class="result-meta">

      <div class="meta-label">
        Sua tendência predominante
      </div>

      <div class="meta-value">
        ${primary}
      </div>

    </div>

    ${secondaryBlock}

    <div class="result-quote">
      “${result.conversa}”
    </div>

    <div class="result-text">
      ${result.texto}
    </div>

    <div class="result-label">
      Um primeiro movimento
    </div>

    <div class="result-text">
      ${result.movimento}
    </div>

    <div class="result-label">
      Quer aprofundar essa leitura?
    </div>

    <div class="result-text">
      O Mapa da Conversa completo analisa suas respostas
      em 18 situações para mostrar como suas travas aparecem
      ao Escutar, Falar e Interagir.
    </div>

    <button class="btn"
      onclick="window.location.href='https://www.adrianadecastro.com.br/mapa-da-conversa'">
      Quero conhecer meu Mapa da Conversa completo →
    </button>

  `;
}


renderIntro();

</script>
